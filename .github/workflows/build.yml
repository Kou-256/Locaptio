name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build WinUI app
        shell: pwsh
        run: dotnet build src/WinUI/Locaptio.WinUI.csproj -c Release -p:Platform=x64 "-p:OutDir=$env:GITHUB_WORKSPACE/artifacts/ci-build/" -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/Locaptio"
      - name: Check Windows caption tracking
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release -- --windows-captions
      - name: Check streaming translation coordination
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --streaming-translation
      - name: Check live Windows caption AI correction
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --windows-correction
      - name: Check speaker clustering and bounded work
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --speakers
      - name: Check Windows caption language switching policy
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --windows-language
      - name: Check model preparation reporting
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --preparation
      - name: Check Windows captions recovery
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --windows-recovery
      - name: Check stable caption rows
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --caption-history
      - name: Check recording search and automatic LLM preparation
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --recording-playback
      - name: Check audio file import and recording bundles
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --file-import
      - name: Check Japanese setup diagnostics
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --setup-encoding
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check official website
        working-directory: website
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Create portable ZIP
        shell: pwsh
        run: ./scripts/build-portable.ps1 -NoBuild -BuildOutputDirectory artifacts/ci-build
      - name: Create Setup installer
        shell: pwsh
        run: |
          $stage = Get-ChildItem artifacts/distribution -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./scripts/build-setup.ps1 -AppSource (Join-Path $stage.FullName 'Locaptio') -Destination artifacts/setup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Locaptio-win-x64
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/SHA256SUMS.txt
            artifacts/setup/Locaptio-Setup-x64.exe
            artifacts/setup/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
