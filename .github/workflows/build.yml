name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build WinUI app
        shell: pwsh
        run: dotnet build src/WinUI/Locaptio.WinUI.csproj -c Release -p:Platform=x64 "-p:OutDir=$env:GITHUB_WORKSPACE/artifacts/ci-build/" -p:ContinuousIntegrationBuild=true "-p:PathMap=$env:GITHUB_WORKSPACE=/_/Locaptio"
      - name: Check Windows caption tracking
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release -- --windows-captions
      - name: Check streaming translation coordination
        run: dotnet run --project src/Tests/Locaptio.Tests.csproj -c Release --no-build -- --streaming-translation
      - name: Create portable ZIP
        shell: pwsh
        run: ./scripts/build-portable.ps1 -NoBuild -BuildOutputDirectory artifacts/ci-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Locaptio-win-x64
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
